<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Flowmap</title>
<style>
/* Layout: full-height app — top bar, file tree | zoomable canvas | detail panel. Dark-first, light toggle. */
:root{
  --bg:#0f172a; --surface:#1e293b; --surface2:#172236; --raised:#273449; --line:#334155; --line2:#2b3a51;
  --fg:#e2e8f0; --muted:#94a3b8; --faint:#64748b; --accent:#3b82f6; --cyan:#06b6d4;
  --shadow:0 1px 2px rgba(0,0,0,.35),0 6px 18px rgba(0,0,0,.22);
  --grid:rgba(148,163,184,.08); --scrim:rgba(2,6,23,.62); --ink-on-accent:#0b1220;
  --c-ui:#eab308; --c-api:#3b82f6; --c-event:#ef4444; --c-service:#8b5cf6; --c-data:#22c55e; --c-infra:#f97316; --c-config:#64748b; --c-test:#06b6d4; --c-docs:#94a3b8;
  --ok:#22c55e; --warn:#f59e0b; --bad:#ef4444;
  --font:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace;
  color-scheme:dark;
}
@media (prefers-color-scheme: light){:root:not([data-theme="dark"]){
  --bg:#f1f5f9; --surface:#ffffff; --surface2:#f8fafc; --raised:#e2e8f0; --line:#dbe3ee; --line2:#e7edf5;
  --fg:#0f172a; --muted:#475569; --faint:#64748b; --grid:rgba(15,23,42,.07); --scrim:rgba(15,23,42,.35);
  --shadow:0 1px 2px rgba(15,23,42,.06),0 6px 16px rgba(15,23,42,.06); color-scheme:light;}}
:root[data-theme="light"]{
  --bg:#f1f5f9; --surface:#ffffff; --surface2:#f8fafc; --raised:#e2e8f0; --line:#dbe3ee; --line2:#e7edf5;
  --fg:#0f172a; --muted:#475569; --faint:#64748b; --grid:rgba(15,23,42,.07); --scrim:rgba(15,23,42,.35);
  --shadow:0 1px 2px rgba(15,23,42,.06),0 6px 16px rgba(15,23,42,.06); color-scheme:light;}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:13px/1.45 var(--font);overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
code,.mono{font-family:var(--mono)}
.app{height:100%;display:flex;flex-direction:column}

/* top bar */
.top{display:flex;align-items:center;gap:10px;padding:8px 16px;border-bottom:1px solid var(--line);background:var(--surface);flex-wrap:wrap;position:relative;z-index:20}
.logo{display:flex;align-items:center;gap:7px;font-weight:750;font-size:15px;letter-spacing:-.01em;white-space:nowrap}
.logo svg{width:22px;height:22px}
.proj{display:flex;align-items:center;gap:8px;padding:5px 10px;border:1px solid var(--line);border-radius:8px;background:var(--surface2);max-width:280px;min-width:0}
.proj b{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.proj small{color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pill{font-size:10px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:2px 7px;border-radius:999px;white-space:nowrap;background:color-mix(in srgb,var(--pc,var(--faint)) 16%,transparent);color:color-mix(in srgb,var(--pc,var(--faint)) 80%,var(--fg))}
.pill.live{--pc:var(--ok)} .pill.live::before{content:"";display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--ok);margin-right:5px;vertical-align:1px;animation:blink 1.4s infinite}
@keyframes blink{50%{opacity:.25}}
.search{position:relative;flex:0 1 260px;min-width:140px}
.search input{width:100%;padding:7px 10px 7px 30px;border:1px solid var(--line);border-radius:8px;background:var(--surface2);outline:none}
.search input:focus{border-color:var(--accent)}
.search svg{position:absolute;left:9px;top:50%;transform:translateY(-50%);width:14px;height:14px;color:var(--faint)}
.tabs{display:flex;background:var(--surface2);border:1px solid var(--line);border-radius:9px;padding:3px;gap:2px;overflow-x:auto;max-width:100%}
.tab{padding:5px 11px;border-radius:6px;border:0;background:none;color:var(--muted);white-space:nowrap;font-weight:550}
.tab:hover{color:var(--fg)} .tab.on{background:var(--raised);color:var(--fg)}
.tab kbd{margin-left:6px}
.spacer{flex:1}
.btn{display:inline-flex;align-items:center;gap:6px;padding:6px 10px;border:1px solid var(--line);border-radius:8px;background:var(--surface2);color:var(--fg);white-space:nowrap;font-weight:550;transition:border-color .15s,background .15s}
.btn:hover{border-color:var(--accent)}
.btn.on{background:color-mix(in srgb,var(--accent) 18%,transparent);border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.sm{padding:3px 8px;font-size:12px}
.btn svg{width:14px;height:14px}
kbd{font:600 10px var(--mono);padding:1px 5px;border:1px solid var(--line);border-bottom-width:2px;border-radius:4px;color:var(--muted);background:var(--surface)}
.health{display:inline-flex;align-items:center;gap:6px;font-weight:700;font-variant-numeric:tabular-nums}
.health i{width:8px;height:8px;border-radius:50%;display:inline-block}

/* main grid */
.main{flex:1;display:grid;grid-template-columns:260px minmax(0,1fr) auto;min-height:0}
.side{border-right:1px solid var(--line);background:var(--surface);overflow:auto;padding:10px 8px 24px}
.detail{width:0;overflow:hidden;border-left:1px solid var(--line);background:var(--surface);transition:width .2s}
.detail.open{width:340px;overflow:auto}
.view{flex:1;min-width:0;min-height:0;overflow:auto;position:relative}
.view[hidden]{display:none!important}
#v-overview{display:flex;flex-direction:column;overflow:hidden}

/* sidebar */
.grp{margin-bottom:6px}
.grp>button{display:flex;align-items:center;gap:8px;width:100%;padding:6px 8px;border:0;background:none;border-radius:7px;font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);text-align:left}
.grp>button:hover{background:var(--surface2)}
.grp>button .car{width:10px;transition:transform .15s;color:var(--faint)}
.grp.closed>button .car{transform:rotate(-90deg)}
.grp.closed .items{display:none}
.grp>button em{margin-left:auto;font-style:normal;font-weight:600;color:var(--faint)}
.item{display:flex;align-items:center;gap:8px;padding:4px 8px 4px 22px;border-radius:7px;cursor:pointer;min-width:0}
.item:hover{background:var(--surface2)}
.item.sel{background:color-mix(in srgb,var(--accent) 16%,transparent)}
.item .n2{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item .n2 small{color:var(--faint);font-family:var(--mono);font-size:10.5px;margin-left:4px}
.item.changed .n2{color:var(--ok)}
.dot{width:8px;height:8px;border-radius:50%;flex:none;background:var(--lc)}
.b{display:inline-block;font-size:10px;line-height:1.5;padding:0 6px;border-radius:999px;background:color-mix(in srgb,var(--bc,var(--faint)) 15%,transparent);color:color-mix(in srgb,var(--bc,var(--faint)) 78%,var(--fg));white-space:nowrap;font-weight:650}
.empty-side{color:var(--faint);padding:8px 10px;font-size:12px}

/* stats + legend */
.stats{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:10px;padding:12px 16px 8px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:9px 12px;min-width:0;box-shadow:var(--shadow)}
.stat span{display:block;font-size:10.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.07em;font-weight:650}
.stat b{display:block;font-size:28px;font-weight:800;line-height:1.15;background:linear-gradient(90deg,#3b82f6,#06b6d4);-webkit-background-clip:text;background-clip:text;color:transparent;font-variant-numeric:tabular-nums}
.stat small{display:block;color:var(--faint);font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.legend{display:flex;gap:6px;flex-wrap:wrap;padding:0 16px 10px;align-items:center}
.chip{display:inline-flex;align-items:center;gap:6px;padding:3px 9px;border:1px solid var(--line);border-radius:999px;font-size:11.5px;background:var(--surface);color:var(--fg)}
.chip em{font-style:normal;color:var(--faint);font-variant-numeric:tabular-nums}
.chip.off{opacity:.42}
.chip.off .dot,.chip.off .ln{filter:grayscale(1)}
.chip .ln{width:16px;height:0;border-top:2px solid var(--lc)}
.chip .ln.dash{border-top-style:dashed}
.legend .sep{width:1px;height:18px;background:var(--line);margin:0 4px}

/* canvas */
.vp{position:relative;flex:1;min-height:240px;overflow:hidden;background-color:var(--bg);background-image:radial-gradient(var(--grid) 1.2px,transparent 1.2px);background-size:22px 22px;cursor:grab;border-top:1px solid var(--line);touch-action:none;user-select:none}
.vp.panning{cursor:grabbing}
.world{position:absolute;left:0;top:0;transform-origin:0 0}
.edges{position:absolute;left:0;top:0;overflow:visible;pointer-events:none}
.edges path{fill:none;stroke-width:1.4;opacity:.32;transition:opacity .15s}
.e-import{stroke:var(--faint);marker-end:url(#m-import)}
.e-http{stroke:#3b82f6;stroke-dasharray:6 4;marker-end:url(#m-http)}
.e-event{stroke:#ef4444;stroke-dasharray:3 4;marker-end:url(#m-event)}
.e-data{stroke:#22c55e;stroke-dasharray:1.5 3.5;marker-end:url(#m-data)}
.edges path.hide{display:none}
.world.focus .edges path{opacity:.05}
.world.focus .edges path.on{opacity:1;stroke-width:2.2;animation:dash .9s linear infinite}
.world.focus .edges path.on.e-import{stroke-dasharray:7 4;stroke:var(--muted)}
@keyframes dash{to{stroke-dashoffset:-20}}
.colhead{position:absolute;font-size:11px;font-weight:750;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);display:flex;gap:8px;align-items:center;white-space:nowrap}
.colhead em{font-style:normal;color:var(--faint);font-weight:600}
.node{position:absolute;width:216px;height:66px;background:var(--surface);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow);padding:8px 10px;display:grid;grid-template-columns:30px minmax(0,1fr);grid-template-rows:auto auto;column-gap:9px;row-gap:3px;cursor:pointer;transition:transform .15s,box-shadow .15s,border-color .15s,opacity .15s}
.node:hover{transform:translateY(-2px);border-color:#3b82f6;box-shadow:0 0 0 3px color-mix(in srgb,#3b82f6 26%,transparent),var(--shadow);z-index:3}
.node.hide{display:none}
.ic{grid-row:1 / span 2;width:30px;height:30px;border-radius:8px;display:grid;place-items:center;font:750 9.5px var(--mono);color:color-mix(in srgb,var(--lc) 82%,var(--fg));background:color-mix(in srgb,var(--lc) 16%,transparent);align-self:center}
.nm{min-width:0}
.nm b{display:block;font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:650}
.nm span{display:block;font:10.5px var(--mono);color:var(--faint);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bdg{display:flex;gap:4px;min-width:0;overflow:hidden}
.node .wf{position:absolute;top:5px;right:7px;width:15px;height:15px;color:var(--warn)}
.node.sel{border-color:#3b82f6;box-shadow:0 0 0 3px color-mix(in srgb,#3b82f6 40%,transparent),0 0 26px color-mix(in srgb,#3b82f6 40%,transparent);z-index:4}
.world.focus .node:not(.rel):not(.sel){opacity:.2}
.node.onpath{border-color:var(--cyan);box-shadow:0 0 0 3px color-mix(in srgb,var(--cyan) 35%,transparent),var(--shadow)}
.node.imp{border-color:var(--c-infra);box-shadow:0 0 0 2px color-mix(in srgb,var(--c-infra) 35%,transparent)}
.node.dep{border-color:#3b82f6;border-style:dashed}
.node[data-tag]::after{content:attr(data-tag);position:absolute;left:10px;bottom:-9px;font-size:9.5px;font-weight:700;padding:0 7px;border-radius:999px;background:var(--c-infra);color:var(--ink-on-accent);white-space:nowrap}
.node .step{position:absolute;top:-9px;right:10px;font-size:10px;font-weight:800;background:var(--cyan);color:var(--ink-on-accent);border-radius:999px;padding:0 7px}
.node.pulse{animation:pulse 1.1s ease-out}
@keyframes pulse{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--cyan) 75%,transparent)}100%{box-shadow:0 0 0 20px transparent}}
.node.changed::before{content:"";position:absolute;inset:-5px;border-radius:14px;border:2px solid var(--ok);animation:ring 7s forwards;pointer-events:none}
@keyframes ring{0%{opacity:1}70%{opacity:.8}100%{opacity:0}}
.mini{position:absolute;right:12px;bottom:12px;width:200px;height:130px;background:var(--surface);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow);cursor:pointer;overflow:hidden}
.mini canvas{width:100%;height:100%;display:block}
.ctrls{position:absolute;left:12px;bottom:12px;display:flex;gap:4px;flex-wrap:wrap;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:4px;box-shadow:var(--shadow);max-width:calc(100% - 240px)}
.ctrls .btn{padding:4px 8px;border-color:transparent;background:none}
.ctrls .btn:hover{border-color:var(--line)}
.ctrls .btn.on{border-color:var(--accent)}
.ctrls .zl{min-width:44px;text-align:center;font-variant-numeric:tabular-nums;color:var(--muted);font-size:12px}
.banner{position:absolute;top:12px;left:50%;transform:translateX(-50%);background:var(--surface);border:1px solid var(--cyan);border-radius:999px;padding:6px 8px 6px 14px;display:flex;gap:10px;align-items:center;box-shadow:var(--shadow);font-weight:600;max-width:calc(100% - 32px);z-index:5}
.banner[hidden]{display:none}

/* detail */
.dp{padding:16px 16px 40px;display:flex;flex-direction:column;gap:14px}
.dp-h{display:flex;gap:10px;align-items:flex-start}
.dp-h .ic{width:36px;height:36px;grid-row:auto;font-size:11px}
.dp-h h3{margin:0;font-size:15px;word-break:break-all}
.dp-h p{margin:2px 0 0;font:11px var(--mono);color:var(--faint);word-break:break-all}
.dp-x{margin-left:auto;border:0;background:none;color:var(--muted);font-size:18px;line-height:1;padding:2px 6px;border-radius:6px}
.dp-x:hover{background:var(--surface2)}
.kv{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.kv div{background:var(--surface2);border:1px solid var(--line2);border-radius:8px;padding:6px 8px}
.kv b{display:block;font-size:16px;font-variant-numeric:tabular-nums}
.kv span{font-size:10.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.sec h5{margin:0 0 6px;font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);display:flex;gap:6px;align-items:center}
.sec h5 em{font-style:normal;color:var(--faint)}
.rows{display:flex;flex-direction:column;gap:3px}
.r{display:flex;align-items:center;gap:8px;padding:5px 8px;border-radius:7px;background:var(--surface2);font:11.5px var(--mono);min-width:0}
.r .t{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.r .ln{color:var(--faint);font-size:10.5px}
.r.click{cursor:pointer} .r.click:hover{outline:1px solid var(--accent)}
.meth{font:700 9.5px var(--mono);padding:1px 5px;border-radius:4px;min-width:42px;text-align:center;background:color-mix(in srgb,var(--mc,#3b82f6) 16%,transparent);color:color-mix(in srgb,var(--mc,#3b82f6) 80%,var(--fg))}
.note{font-size:12px;color:var(--muted);background:var(--surface2);border:1px solid var(--line2);border-radius:8px;padding:8px 10px}
.note.warn{border-color:color-mix(in srgb,var(--warn) 45%,transparent)}
.note.bad{border-color:color-mix(in srgb,var(--bad) 45%,transparent)}
.acts{display:flex;gap:6px;flex-wrap:wrap}

/* page views */
.page{padding:18px 16px 40px;max-width:1280px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
.ph{display:flex;align-items:flex-end;gap:12px;flex-wrap:wrap}
.ph h2{margin:0;font-size:18px;letter-spacing:-.01em}
.ph p{margin:2px 0 0;color:var(--muted);max-width:70ch}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow);min-width:0}
.card>header{display:flex;align-items:center;gap:8px;padding:10px 14px;border-bottom:1px solid var(--line);min-width:0}
.card>header h4{margin:0;font-size:13px;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.card>.bd{padding:12px 14px}
.tile{width:26px;height:26px;border-radius:7px;display:grid;place-items:center;font:750 9px var(--mono);flex:none;color:color-mix(in srgb,var(--lc) 82%,var(--fg));background:color-mix(in srgb,var(--lc) 16%,transparent)}

/* flows */
.flows{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:14px;align-items:start}
.steps{display:flex;flex-direction:column;padding:12px 14px}
.stp{display:grid;grid-template-columns:30px minmax(0,1fr) auto;gap:10px;align-items:center;padding:7px 10px;border:1px solid var(--line);border-radius:8px;background:var(--surface2);cursor:pointer;transition:border-color .15s}
.stp:hover{border-color:var(--accent)}
.stp .tile{width:30px;height:30px}
.stp b{display:block;font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stp small{display:block;font:10.5px var(--mono);color:var(--faint);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stp .k{font:700 9.5px var(--mono);letter-spacing:.06em;color:color-mix(in srgb,var(--lc) 80%,var(--fg))}
.stp.on{border-color:var(--cyan);animation:pulse 1.1s ease-out}
.cn{width:2px;height:12px;background:var(--line);margin-left:24px}
.cn.on{background:var(--cyan)}

/* wiring */
.wrow{display:grid;grid-template-columns:minmax(0,1fr) 84px minmax(0,1.1fr);gap:10px;align-items:center;padding:7px 14px;font:12px var(--mono);border-top:1px solid var(--line2)}
.wrow:first-child{border-top:0}
.wrow .t{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.wrow .t small{color:var(--faint)}
.wrow .t.click{cursor:pointer} .wrow .t.click:hover{text-decoration:underline}
.arrow{width:84px;height:12px;display:block}
.arrow line{stroke-width:2;stroke-dasharray:6 4;animation:dash .9s linear infinite}
.miss{color:var(--bad);font-family:var(--font);font-size:12px}
.chain{display:flex;gap:6px;align-items:center;flex-wrap:wrap;padding:10px 14px;border-top:1px solid var(--line2);font:12px var(--mono)}
.grid2{display:grid;grid-template-columns:repeat(auto-fill,minmax(380px,1fr));gap:14px;align-items:start}

/* insights */
.ins-top{display:grid;grid-template-columns:240px minmax(0,1fr);gap:14px}
.ring{display:flex;gap:14px;align-items:center;padding:16px}
.ring svg{width:96px;height:96px;flex:none}
.ring b{font-size:13px}
.ring p{margin:4px 0 0;color:var(--muted);font-size:12px}
.langbar{display:flex;height:10px;border-radius:999px;overflow:hidden;background:var(--surface2);margin:4px 0 10px}
.langbar i{display:block;height:100%}
.langs{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:12px;color:var(--muted)}
.langs span{display:inline-flex;gap:6px;align-items:center}
.stack{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.iss{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:start;padding:10px 14px;border-top:1px solid var(--line2)}
.iss:first-child{border-top:0}
.iss b{font-size:12.5px}
.iss p{margin:2px 0 0;color:var(--muted);font-size:12px}
.iss .files{display:flex;flex-wrap:wrap;gap:4px;margin-top:5px}
.fl{font:11px var(--mono);padding:1px 6px;border-radius:5px;background:var(--surface2);border:1px solid var(--line2);cursor:pointer}
.fl:hover{border-color:var(--accent)}
.sev{--pc:var(--faint)} .sev.high{--pc:var(--bad)} .sev.med{--pc:var(--warn)} .sev.low{--pc:var(--cyan)}
.seg{display:flex;gap:4px;flex-wrap:wrap}
.tbl-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:12px}
th,td{text-align:left;padding:7px 10px;border-top:1px solid var(--line2);white-space:nowrap}
th{font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);border-top:0}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
tr.click{cursor:pointer} tr.click:hover td{background:var(--surface2)}

/* live */
.live-grid{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:14px;align-items:start}
.srcrow{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.meta{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.meta div{background:var(--surface2);border:1px solid var(--line2);border-radius:8px;padding:7px 9px;min-width:0}
.meta b{display:block;font-size:15px;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.meta span{font-size:10.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.spark{width:100%;height:56px;display:block}
.feed{max-height:520px;overflow:auto}
.ev{display:grid;grid-template-columns:62px 18px minmax(0,1fr);gap:8px;padding:8px 14px;border-top:1px solid var(--line2);align-items:start}
.ev:first-child{border-top:0}
.ev time{font:11px var(--mono);color:var(--faint);padding-top:1px}
.ev .k{font-weight:800;text-align:center}
.ev .k.added{color:var(--ok)} .ev .k.modified{color:var(--warn)} .ev .k.removed{color:var(--bad)}
.ev b{font:12px var(--mono);cursor:pointer;word-break:break-all}
.ev p{margin:2px 0 0;font-size:11.5px;color:var(--muted)}
.ev.fresh{animation:flash 1.6s ease-out}
@keyframes flash{from{background:color-mix(in srgb,var(--ok) 18%,transparent)}to{background:transparent}}
textarea.tr{width:100%;min-height:150px;resize:vertical;padding:10px;border:1px solid var(--line);border-radius:8px;background:var(--surface2);font:11.5px/1.5 var(--mono);outline:none}
textarea.tr:focus{border-color:var(--accent)}
.empty{color:var(--faint);padding:18px 14px;text-align:center;font-size:12.5px}
select.sel{padding:5px 8px;border:1px solid var(--line);border-radius:7px;background:var(--surface2)}

/* overlays */
.modal-bg{position:fixed;inset:0;background:var(--scrim);display:flex;justify-content:center;align-items:flex-start;padding:9vh 16px 16px;z-index:60}
.modal-bg[hidden]{display:none}
.modal{width:min(640px,100%);background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:0 20px 60px rgba(0,0,0,.4);overflow:hidden;display:flex;flex-direction:column;max-height:80vh}
.modal>header{display:flex;align-items:center;gap:10px;padding:12px 14px;border-bottom:1px solid var(--line)}
.modal>header h4{margin:0;flex:1;font-size:14px}
.pal-in{width:100%;border:0;background:none;padding:14px 16px;font-size:15px;outline:none;border-bottom:1px solid var(--line)}
.pal-list{overflow:auto;padding:6px}
.pi{display:flex;gap:10px;align-items:center;padding:7px 10px;border-radius:7px;cursor:pointer;min-width:0}
.pi.on{background:color-mix(in srgb,var(--accent) 18%,transparent)}
.pi .t{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pi .t small{color:var(--faint);font-family:var(--mono);margin-left:6px}
.pi .g{font-size:10px;color:var(--faint);text-transform:uppercase;letter-spacing:.06em}
.pal-foot{display:flex;gap:12px;flex-wrap:wrap;padding:8px 14px;border-top:1px solid var(--line);font-size:11px;color:var(--muted)}
.menu{position:absolute;top:calc(100% + 6px);left:0;width:330px;max-width:calc(100vw - 32px);background:var(--surface);border:1px solid var(--line);border-radius:10px;box-shadow:0 16px 40px rgba(0,0,0,.35);padding:6px;z-index:40}
.menu[hidden]{display:none}
.mi{display:flex;gap:10px;align-items:flex-start;width:100%;text-align:left;padding:8px 10px;border:0;background:none;border-radius:7px}
.mi:hover{background:var(--surface2)}
.mi b{display:block;font-size:12.5px}
.mi small{display:block;color:var(--muted);font-size:11.5px}
.mi .tile{margin-top:1px}
.menu hr{border:0;border-top:1px solid var(--line);margin:6px 4px}
.menu .cap{font-size:10.5px;text-transform:uppercase;letter-spacing:.07em;color:var(--faint);padding:4px 10px}
.drop{position:fixed;inset:0;background:color-mix(in srgb,var(--bg) 82%,transparent);border:3px dashed var(--accent);display:grid;place-items:center;z-index:80;font-size:18px;font-weight:700;pointer-events:none}
.drop[hidden]{display:none}
.busy{position:fixed;inset:0;background:var(--scrim);display:grid;place-items:center;z-index:90}
.busy[hidden]{display:none}
.busy div{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px 20px;font-weight:600;box-shadow:var(--shadow)}
.toast{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);background:var(--raised);color:var(--fg);border:1px solid var(--line);border-radius:9px;padding:8px 14px;box-shadow:var(--shadow);z-index:100;font-weight:550;max-width:calc(100vw - 32px)}
.toast[hidden]{display:none}
textarea.out{width:100%;height:46vh;border:0;border-top:1px solid var(--line);padding:12px 14px;background:var(--surface2);font:11.5px/1.5 var(--mono);resize:none;outline:none}

@media (max-width:1100px){.stats{grid-template-columns:repeat(3,minmax(0,1fr))} .ins-top,.live-grid{grid-template-columns:minmax(0,1fr)}}
@media (max-width:900px){
  .main{grid-template-columns:minmax(0,1fr)}
  .side{display:none}
  .detail{position:fixed;left:0;right:0;bottom:0;width:auto;max-height:0;border-left:0;border-top:1px solid var(--line);z-index:30;transition:max-height .2s}
  .detail.open{width:auto;max-height:62vh}
  .search{order:9;flex:1 1 100%}
  .hide-sm{display:none!important}
  .mini{display:none}
  .ctrls{max-width:calc(100% - 24px)}
  .grid2,.flows{grid-template-columns:minmax(0,1fr)}
}
@media (max-width:520px){.stats{grid-template-columns:repeat(2,minmax(0,1fr))} .stat b{font-size:22px} .wrow{grid-template-columns:minmax(0,1fr);gap:2px} .wrow .arrow{transform:rotate(90deg);width:20px} .meta{grid-template-columns:repeat(2,1fr)}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}

<script>
/* ---------- Sample projects (real source text, scanned by the same engine as your folder) ---------- */
const DEMOS = {};

/* ---------- Universal scanning engine ---------- */
const LANG = {js:'JavaScript',jsx:'JavaScript',mjs:'JavaScript',cjs:'JavaScript',ts:'TypeScript',tsx:'TypeScript',vue:'Vue',svelte:'Svelte',astro:'Astro',

  html:'HTML',htm:'HTML',css:'CSS',scss:'SCSS',sass:'SCSS',less:'Less',json:'JSON',yml:'YAML',yaml:'YAML',toml:'TOML',xml:'XML',ini:'INI',
  sql:'SQL',prisma:'Prisma',graphql:'GraphQL',gql:'GraphQL',proto:'Protobuf',md:'Markdown',mdx:'Markdown',rst:'Text',txt:'Text',tf:'Terraform',gradle:'Gradle',properties:'Config',csproj:'XML',env:'Env'};
const SHORT = {JavaScript:'JS',TypeScript:'TS',Vue:'VUE',Svelte:'SV',Astro:'AST',Python:'PY',Go:'GO',Java:'JV',Kotlin:'KT',Scala:'SC','C#':'C#',PHP:'PHP',Ruby:'RB',Rust:'RS',Dart:'DT',Swift:'SW',C:'C','C++':'C++',Elixir:'EX',
  HTML:'</>',CSS:'CSS',SCSS:'CSS',Less:'CSS',JSON:'{ }',YAML:'YML',TOML:'TML',XML:'XML',SQL:'SQL',Prisma:'DB',GraphQL:'GQL',Protobuf:'PB',Markdown:'MD',Shell:'SH',Terraform:'TF',Docker:'DKR',Make:'MK',Env:'ENV',Notebook:'NB',Text:'TXT',Gradle:'GRD',Config:'CFG',INI:'INI',Lua:'LUA',R:'R'};
const LANG_COLOR = {TypeScript:'#3b82f6',JavaScript:'#eab308',Python:'#22c55e',Vue:'#10b981',Go:'#06b6d4',Java:'#f97316',Kotlin:'#a855f7','C#':'#8b5cf6',PHP:'#6366f1',Ruby:'#ef4444',Rust:'#c2410c',Dart:'#0ea5e9',Swift:'#fb923c',HTML:'#e34c26',CSS:'#ec4899',SCSS:'#ec4899',JSON:'#94a3b8',YAML:'#64748b',Prisma:'#14b8a6',SQL:'#84cc16',Markdown:'#a1a1aa',Docker:'#38bdf8',Svelte:'#f43f5e'};
const CODE_EXT = new Set(['js','jsx','mjs','cjs','ts','tsx','vue','svelte','astro','py','go','java','kt','kts','scala','cs','php','rb','rs','dart','swift','c','h','cpp','hpp','cc','ex','exs','lua','r']);
const JSX = new Set(['js','jsx','mjs','cjs','ts','tsx','vue','svelte','astro']);
const UI_EXT = new Set(['jsx','tsx','vue','svelte','astro','html','htm','css','scss','sass','less','dart','swift']);
const SKIP_DIRS = new Set(['node_modules','.git','dist','build','out','.next','.nuxt','.svelte-kit','venv','.venv','env','__pycache__','vendor','target','bin','obj','.idea','.vscode','coverage','.cache','Pods','.gradle','site-packages','.dart_tool','.turbo','.parcel-cache','.pytest_cache','.mypy_cache','tmp','.terraform','storybook-static']);
const MAX_FILES = 3000, MAX_SIZE = 400000;
const EV_STOP = new Set(['click','change','input','submit','load','error','data','end','close','open','message','connection','ready','keydown','keyup','keypress','resize','scroll','mount','unmount','finish','exit','response','request','drain','readable','line','focus','blur','success','complete','mouseover','mouseout','mousedown','mouseup','touchstart','touchend','DOMContentLoaded','beforeunload','popstate','hashchange','storage','online','offline','visibilitychange','refresh','onload','validate','setup']);

const extOf = n => { const i = n.lastIndexOf('.'); return i > 0 ? n.slice(i + 1).toLowerCase() : ''; };
function langOf(name, ext){
  if (/^dockerfile/i.test(name) || /\.dockerfile$/i.test(name)) return 'Docker';
  if (/^makefile$/i.test(name)) return 'Make';
  if (/^\.env/.test(name)) return 'Env';
  if (/^(gemfile|rakefile)$/i.test(name)) return 'Ruby';
  if (/^(jenkinsfile|procfile)$/i.test(name)) return 'Config';
  return LANG[ext] || 'Other';
}
function wantFile(name){
  if (/\.(min\.js|map|lock|snap)$/i.test(name) || /^(package-lock\.json|yarn\.lock|pnpm-lock\.yaml|poetry\.lock|composer\.lock|go\.sum|Cargo\.lock|Gemfile\.lock)$/i.test(name)) return false;
  return !!LANG[extOf(name)] || /^(dockerfile|makefile|jenkinsfile|procfile|gemfile|rakefile|\.env)/i.test(name);

const skipDir = n => SKIP_DIRS.has(n) || (n.startsWith('.') && !/^\.(github|gitlab|circleci)$/.test(n));
function mkLines(t){ const a=[0]; for(let i=0;i<t.length;i++) if(t.charCodeAt(i)===10) a.push(i+1); return a; }

/* ----- per-file parse: pure, cached per file version ----- */
function parseFile(path, text){
  const name = path.split('/').pop(), ext = extOf(name), dir = path.includes('/') ? path.slice(0, path.lastIndexOf('/')) : '';
  const f = {path,name,dir,ext,lang:langOf(name,ext),size:text.length,loc:0,imports:[],binds:{},mounts:[],routes:[],calls:[],external:[],models:[],emits:[],listens:[],bindings:[],fns:0,todos:[],envs:[],secrets:[],ns:null,prefix:'',deps:[]};
  let loc=0; for (const l of text.split('\n')) if (l.trim()) loc++; f.loc = loc;
  if (text.length > MAX_SIZE) return f;
  const Ls = mkLines(text), ln = i => lineOf(Ls, i);
  const each = (re, fn) => { re.lastIndex = 0; let m; while ((m = re.exec(text)) !== null) { fn(m); if (m.index === re.lastIndex) re.lastIndex++; } };
  const addRoute = (method, p, idx, handler, abs) => f.routes.push({method:String(method).toUpperCase(), path:p, line:ln(idx), handler:handler||'', abs:!!abs});
  const addCall = (method, url, idx) => {
    url = String(url).trim(); if (!url) return;
    if (/^https?:\/\//i.test(url)) {
      const host = url.replace(/^https?:\/\//i,'').split(/[\/?#:]/)[0];
      if (/^(localhost|127\.|0\.0\.0\.0)/.test(host)) { url = url.replace(/^https?:\/\/[^\/]+/i,'') || '/'; }
      else { f.external.push({host, url:url.replace(/\$\{[^}]*\}/g,'…'), method:method.toUpperCase(), line:ln(idx)}); return; }
    }
    url = url.replace(/^\$\{[^}]*\}/,'').replace(/\$\{[^}]*\}/g,':p').replace(/\{[^}]*\}/g,':p').split(/[?#]/)[0];
    if (!url.startsWith('/')) { if (!url.includes('/')) return; url = '/' + url; }
    if (url.length < 2) return;
    f.calls.push({method:method.toUpperCase(), url, line:ln(idx)});
  };
  const nextAfter = (idx, re) => { const m = re.exec(text.slice(idx, idx + 500)); return m ? m[1] : ''; };
  const isJS = JSX.has(ext), isPy = ext === 'py', code = CODE_EXT.has(ext);

  // universal: TODOs, env vars, secrets
  each(/\b(TODO|FIXME|HACK|XXX)\b[:\s\-]*([^\n]{0,90})/g, m => f.todos.push({kind:m[1], text:m[2].replace(/\*\/|-->|#}/g,'').trim(), line:ln(m.index)}));
  each(/process\.env\.([A-Z_][A-Z0-9_]*)|import\.meta\.env\.([A-Z_][A-Z0-9_]*)|os\.(?:environ(?:\.get)?\(?\[?|getenv\()\s*['"]([A-Z_][A-Z0-9_]*)|System\.getenv\(\s*"(\w+)|\benv\(\s*['"]([A-Z_][A-Z0-9_]*)|os\.Getenv\(\s*"(\w+)|ENV\[\s*['"](\w+)|Environment\.GetEnvironmentVariable\(\s*"(\w+)/g,
    m => { const v = m.slice(1).find(Boolean); if (v && !f.envs.includes(v)) f.envs.push(v); });

    const seen = new Set();
    const addVuln = (line, kind, sev) => { if (!seen.has(line + ':' + kind)) { seen.add(line + ':' + kind); f.secrets.push({line, kind, sev: sev || 'high'}); } };
    // --- Hardcoded credentials ---
    each(/(?:api[_-]?key|secret(?:_key)?|password|passwd|auth[_-]?token|access[_-]?token|private[_-]?key|access[_-]?key)["']?\s*[:=]\s*["']([^"'\s]{8,})["']/gi, m => {
      if (/^(\$\{|process|os\.|env|<|your|xxx|changeme|example|placeholder|\*+)/i.test(m[1])) return;
      addVuln(ln(m.index), 'Hard-coded credential'); });
    each(/AKIA[0-9A-Z]{16}|-----BEGIN (?:RSA |EC |OPENSSH )?PRIVATE KEY-----|sk_live_[0-9a-zA-Z]{10,}|ghp_[0-9A-Za-z]{30,}|xox[baprs]-[0-9A-Za-z-]{10,}|eyJ[A-Za-z0-9_-]{20,}\.eyJ[A-Za-z0-9_-]{20,}/g, m => {
      addVuln(ln(m.index), 'Key or token in source'); });
    // --- SQL Injection ---
    if (isPy) {
      each(/(?:cursor\.execute|\.raw|\.extra)\(\s*(?:f['"]|['"].*?%s.*?%|.*?\+\s*[\w.]+|.*?\.format\()/g, m => addVuln(ln(m.index), 'Possible SQL injection', 'high'));

    }
    if (isJS) {
      each(/(?:\.query|\.execute|\.raw)\(\s*(?:`[^`]*\$\{|['"][^'"]*['"]\s*\+)/g, m => addVuln(ln(m.index), 'Possible SQL injection', 'high'));

    }
    // --- Command Injection ---

function mapTrace(text){
  const P = S.P, re = /((?:[A-Za-z]:)?[\w.\-\/\\@~]+\.(?:py|js|jsx|ts|tsx|mjs|cjs|vue|svelte|go|java|kt|rb|php|rs|cs|dart|swift|scala|ex|exs))["')]?(?:,\s*line\s*|:|\(|\s+line\s+)(\d+)/g;
  const frames = []; let m;
  while ((m = re.exec(text))) { const raw = m[1].replace(/\\/g, '/'); let best = null;
    for (const n of P.nodes) if ((raw === n.path || raw.endsWith('/' + n.path)) && (!best || n.path.length > best.length)) best = n.path;
    if (!best && !raw.includes('/')) { const c = P.nodes.filter(n => n.name === raw); if (c.length === 1) best = c[0].path; }

function go(v){

  for (const [id] of VIEWS) $('#v-' + id).hidden = id !== v;

function renderView(fit){
  if (S.view === 'overview') { renderMap(true); if (fit || !S.fitted) { S.fitted = true; requestAnimationFrame(fitView); } }
  else if (S.view === 'flow') renderFlows(); else if (S.view === 'wiring') renderWiring(); else if (S.view === 'insights') renderInsights();

function renderAll(fit){ renderHeader(); renderSidebar(); renderView(fit); renderDetail(); }
async function rebuild(fit){
  const n = S.fmap.size;
  if (n > 150) {
    busy(true, `Parsing ${n} files…`);
    // Chunked parsing: parse files in batches, yield to browser for UI updates
    const BATCH = 80;
    const entries = [...S.fmap.entries()];
    let parsed = 0;
    for (let i = 0; i < entries.length; i += BATCH) {
      const batch = entries.slice(i, i + BATCH);
      for (const [p, o] of batch) {
        if (!o.parsed) o.parsed = parseFile(p, o.text);
      }
      parsed += batch.length;
      busy(true, `Parsing files… ${parsed}/${n}`);
      await new Promise(r => setTimeout(r, 0)); // yield to browser
    }
    busy(true, `Analyzing ${n} files…`);
    await new Promise(r => setTimeout(r, 16));
    try {
      S.P = analyze(S.fmap);
      busy(true, 'Laying out map…');
      await new Promise(r => setTimeout(r, 16));
      layoutMap();
      busy(true, 'Rendering…');
      await new Promise(r => setTimeout(r, 16));
      renderAll(fit);
      busy(false);
    } catch(e) { busy(false); toast('Analysis error: ' + e.message); console.error(e); }
  } else {
    S.P = analyze(S.fmap); layoutMap(); renderAll(fit);
  }
}

  const t = e.target.closest('[data-etype]'); if (t) { const id = t.dataset.etype; S.etypes.has(id) ? S.etypes.delete(id) : S.etypes.add(id); t.classList.toggle('off'); applyFilters(); }
});
let qT; $('#q').addEventListener('input', e => { clearTimeout(qT); qT = setTimeout(() => { S.q = e.target.value.trim(); renderSidebar(); if (S.view === 'overview') { applyFilters(); drawMini(); } else renderView(); }, 60); });

function closeMenu(){ $('#projMenu').hidden = true; }
$('#projBtn').addEventListener('click', e => {
  e.stopPropagation(); const m = $('#projMenu'); if (!m.hidden) return closeMenu();
  m.innerHTML = `<div class="cap">Project: ${esc(S.name)}</div>
    <div class="cap" style="text-transform:none;letter-spacing:0;padding:8px 12px">Run <code>/flowmap &lt;project&gt;</code> from Claude Code to scan a project.<br><br>Reads JS/TS, Python, Go, Java, Kotlin, C#, PHP, Ruby, Rust, Dart and more.</div>`;
  m.hidden = false;
});
$('#projMenu').addEventListener('click', e => { const b = e.target.closest('[data-m]'); if (!b) return; const a = b.dataset.m; closeMenu();
  });
document.addEventListener('click', e => { if (!e.target.closest('#projMenu') && !e.target.closest('#projBtn')) closeMenu(); });

function themeToggle(){ const cur = document.documentElement.dataset.theme || (matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark'); const nx = cur === 'dark' ? 'light' : 'dark'; document.documentElement.dataset.theme = nx; store.set('fm-theme', nx); drawMini(); }
$('#themeBtn').onclick = themeToggle;

function palItems(){
  const P = S.P, it = [];
  VIEWS.forEach(([id, l], i) => it.push({g:'View', t:l, k:String(i + 1), run:() => go(id)}));
  it.push({g:'Action', t:'Fit map to screen', k:'F', run:() => { go('overview'); fitView(); }}, {g:'Action', t:'Path tracer', k:'P', run:() => setMode('path')}, {g:'Action', t:'Impact analysis', k:'I', run:() => setMode('impact')},
    {g:'Action', t:'Switch theme', k:'T', run:themeToggle}, {g:'Action', t:'Export report', k:'E', run:openExport});
  // CLI-only — no demo loading
  P.flows.forEach(f => it.push({g:'Flow', t:f.title, run:() => { S.flowQ = ''; go('flow'); }}));
  P.routes.forEach(r => it.push({g:'Route', t:`${r.method} ${r.full}`, s:base(r.file), run:() => selectFile(r.file)}));
  P.nodes.forEach(n => it.push({g:'File', t:n.name, s:n.dir, run:() => selectFile(n.path)}));
  return it;
}
function openPal(){ $('#palBg').hidden = false; const i = $('#palIn'); i.value = ''; S.palAll = palItems(); drawPal(); i.focus(); }
function closePal(){ $('#palBg').hidden = true; }
function drawPal(){
  const q = $('#palIn').value.toLowerCase().trim();
  const sc = it => { if (!q) return it.g === 'View' || it.g === 'Action' ? 2 : 1; const t = (it.t + ' ' + (it.s || '')).toLowerCase(); if (t.startsWith(q)) return 5; if (t.includes(q)) return 3; let j = 0; for (const c of t) if (c === q[j]) j++; return j === q.length ? 1 : 0; };
  S.palItems = S.palAll.map(it => [sc(it), it]).filter(x => x[0]).sort((a, b) => b[0] - a[0]).slice(0, 60).map(x => x[1]); S.palIdx = 0; paintPal();
}
function paintPal(){ $('#palList').innerHTML = S.palItems.length ? S.palItems.map((it, i) => `<div class="pi${i === S.palIdx ? ' on' : ''}" data-i="${i}"><span class="g" style="width:46px">${it.g}</span><span class="t">${esc(it.t)}${it.s ? `<small>${esc(it.s)}</small>` : ''}</span>${it.k ? `<kbd>${it.k}</kbd>` : ''}</div>`).join('') : '<div class="empty">No matches</div>'; $('.pi.on', $('#palList'))?.scrollIntoView({block:'nearest'}); }
$('#palIn').addEventListener('input', drawPal);
$('#palIn').addEventListener('keydown', e => { if (e.key === 'ArrowDown') { S.palIdx = Math.min(S.palItems.length - 1, S.palIdx + 1); paintPal(); e.preventDefault(); } else if (e.key === 'ArrowUp') { S.palIdx = Math.max(0, S.palIdx - 1); paintPal(); e.preventDefault(); } else if (e.key === 'Enter') { const it = S.palItems[S.palIdx]; closePal(); if (it) it.run(); } else if (e.key === 'Escape') closePal(); });
$('#palList').addEventListener('click', e => { const p = e.target.closest('.pi'); if (p) { const it = S.palItems[+p.dataset.i]; closePal(); it.run(); } });
$('#palBg').addEventListener('click', e => { if (e.target.id === 'palBg') closePal(); });
$('#cmdBtn').onclick = openPal;

function exportText(fmtx){
  const P = S.P;
  if (fmtx === 'json') return JSON.stringify({project:S.name, kind:P.kind, generated:new Date().toISOString(), health:P.health, stack:P.stack.map(s => s.name),
    files:P.nodes.map(n => ({path:n.path, layer:n.layer, lang:n.lang, loc:n.loc, routes:n.fullRoutes.map(r => r.method + ' ' + r.full), calls:n.calls.map(c => c.method + ' ' + c.url), models:n.models.map(m => m.name)})),
    edges:P.edges.map(e => ({from:e.s, to:e.t, type:e.type, label:e.label})), issues:P.issues.map(i => ({severity:i.sev, title:i.title, files:i.files}))}, null, 2);
  if (fmtx === 'mermaid') { const id = new Map(P.nodes.map((n, i) => [n.path, 'n' + i])); let s = 'flowchart LR\n';
    for (const L of LAYERS) { const ns = P.nodes.filter(n => n.layer === L.id && !S.hidden.has(n.layer)); if (!ns.length) continue; s += `  subgraph ${L.id}["${L.label}"]\n`; ns.forEach(n => s += `    ${id.get(n.path)}["${n.name.replace(/"/g, "'")}"]\n`); s += '  end\n'; }
    P.edges.filter(e => !S.hidden.has(P.by.get(e.s).layer) && !S.hidden.has(P.by.get(e.t).layer)).forEach(e => s += `  ${id.get(e.s)} ${e.type === 'import' ? '-->' : '-.->'}${e.type !== 'import' ? `|${e.type}|` : ''} ${id.get(e.t)}\n`); return s; }
  let md = `# ${S.name} — architecture report\n\nGenerated by Flowmap on ${new Date().toLocaleString()}\n\n## Summary\n\n- Type: ${P.kind}\n- Health: ${P.health}/100\n- ${P.nodes.length} files, ${P.loc} lines\n- ${P.routes.length} endpoints, ${P.matched}/${P.calls} frontend calls wired\n- ${P.models.size} data models, ${P.events.length} events\n- Stack: ${P.stack.map(s => s.name).join(', ') || '—'}\n\n## Endpoints\n\n| Method | Path | File | Callers |\n|---|---|---|---|\n`;
  P.routes.forEach(r => md += `| ${r.method} | \`${r.full}\` | ${r.file}:${r.line} | ${r.callers.map(c => base(c.file)).join(', ') || '—'} |\n`);
  md += `\n## Events\n\n`; P.events.forEach(ev => md += `- **${ev.name}**: ${ev.emit.map(e => base(e.file)).join(', ') || '?'} → ${ev.listen.map(l => l.file ? base(l.file) : l.missing).join(', ')}\n`);
  md += `\n## Flows\n\n`; P.flows.forEach(f => md += `### ${f.title}\n${f.steps.map((s, i) => `${i + 1}. ${s.kind}: ${s.label}${s.file ? ` (${s.file})` : ''}`).join('\n')}\n\n`);
  md += `## Issues\n\n`; P.issues.forEach(i => md += `- [${i.sev}] **${i.title}** — ${i.detail} (${i.files.slice(0, 6).join(', ')})\n`);
  md += `\n## Files by layer\n\n`; LAYERS.forEach(L => { const ns = P.nodes.filter(n => n.layer === L.id); if (ns.length) md += `### ${L.label}\n${ns.map(n => `- ${n.path} (${n.loc} lines)`).join('\n')}\n\n`; });
  return md;
}
function openExport(){ $('#expBg').hidden = false; paintExport(); }
function paintExport(){ $('#expOut').value = exportText(S.expFmt); $$('#expSeg .btn').forEach(b => b.classList.toggle('on', b.dataset.f === S.expFmt)); }
$('#exportBtn').onclick = openExport; $('#expX').onclick = () => $('#expBg').hidden = true;
$('#expBg').addEventListener('click', e => { if (e.target.id === 'expBg') $('#expBg').hidden = true; });
$('#expSeg').addEventListener('click', e => { const b = e.target.closest('[data-f]'); if (b) { S.expFmt = b.dataset.f; paintExport(); } });
$('#copyBtn').onclick = async () => { try { await navigator.clipboard.writeText($('#expOut').value); toast('Copied to clipboard'); } catch { $('#expOut').select(); toast('Press Ctrl/⌘ C to copy the selected text.'); } };

document.addEventListener('keydown', e => {
  if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'k') { e.preventDefault(); $('#palBg').hidden ? openPal() : closePal(); return; }
  const tag = e.target.tagName; if (tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT') { if (e.key === 'Escape') e.target.blur(); return; }
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  const k = e.key;
  if (k >= '1' && k <= '5') go(VIEWS[+k - 1][0]);
  else if (k === '/') { e.preventDefault(); $('#q').focus(); }
  else if (k === 'f') { go('overview'); fitView(); }
  else if (k === '+' || k === '=') { const r = $('#vp').getBoundingClientRect(); zoomAt(1.2, r.width / 2, r.height / 2); }
  else if (k === '-') { const r = $('#vp').getBoundingClientRect(); zoomAt(1 / 1.2, r.width / 2, r.height / 2); }
  else if (k === 'p') setMode(S.mode === 'path' ? null : 'path');
  else if (k === 'i') setMode(S.mode === 'impact' ? null : 'impact');
  else if (k === 'd') { S.detailOpen = !S.detailOpen; renderDetail(); }
  else if (k === 't') themeToggle();
  else if (k === 'e') openExport();
  else if (k === 'l') { /* live mode removed — CLI only */ }
  else if (k === '?') openPal();
  else if (k === 'Escape') { if (!$('#expBg').hidden) $('#expBg').hidden = true; else { setMode(null); S.sel = null; S.hl = null; applyHighlight(); renderDetail(); } }
});
setInterval(() => { if (S.view === 'overview' && S.live.recent.size) { const now = Date.now(); for (const [p, t] of S.live.recent) if (now - t > 8000) { S.live.recent.delete(p); S.nodeEls.get(p)?.classList.remove('changed'); } } }, 2000);

/* ---------- boot ---------- */
(() => {
  const th = store.get('fm-theme'); if (th) document.documentElement.dataset.theme = th;
  const v = location.hash.slice(1) || store.get('fm-view') || 'overview';
  S.view = VIEWS.some(x => x[0] === v) ? v : 'overview';
  for (const [id] of VIEWS) $('#v-' + id).hidden = id !== S.view;
  // Auto-load from CLI preload or show empty state
// Decompress zlib+base64 payload using DecompressionStream (modern browsers)
async function decompressPayload(b64) {
  const bin = Uint8Array.from(atob(b64), c => c.charCodeAt(0));
  // DecompressionStream 'deflate' handles zlib format (RFC 1950) — pass full data
  const ds = new DecompressionStream('deflate');
  const writer = ds.writable.getWriter();
  writer.write(bin); writer.close();
  const reader = ds.readable.getReader();
  const chunks = []; let len = 0;
  while (true) { const {done, value} = await reader.read(); if (done) break; chunks.push(value); len += value.length; }
  const out = new Uint8Array(len); let off = 0;
  for (const c of chunks) { out.set(c, off); off += c.length; }
  return new TextDecoder().decode(out);
}

async function loadPreloadData() {
  let preload;
  if (typeof _FLOWMAP_COMPRESSED !== 'undefined') {
    busy(true, 'Decompressing project data…');
    try {
      const json = await decompressPayload(_FLOWMAP_COMPRESSED);
      busy(true, 'Parsing project data…');
      preload = JSON.parse(json);
    } catch(e) {
      console.error('Decompress failed:', e);
      busy(false);
      toast('Failed to load data: ' + e.message);
      return;
    }
    busy(false);
  } else if (typeof _FLOWMAP_PRELOAD !== 'undefined') {
    preload = _FLOWMAP_PRELOAD;
  }
  if (!preload) return false;
  busy(true, 'Loading ' + Object.keys(preload.files).length + ' files…');
  const now = Date.now();
  for (const [p, t] of Object.entries(preload.files)) {
    S.fmap.set(p, {text: t, mtime: now, size: t.length});
  }
  Object.assign(S, {name: preload.name, industry: '', stackLabel: '', source: 'snapshot', sel: null, hl: null, mode: null});
  resetLive();
  // Yield to browser before heavy analysis
  await new Promise(r => setTimeout(r, 50));
  rebuild(true);
  toast('Loaded ' + S.fmap.size + ' files.');
  return true;
}
if (typeof _FLOWMAP_COMPRESSED !== 'undefined' || typeof _FLOWMAP_PRELOAD !== 'undefined') {
  loadPreloadData();
} else {
  // No data — CLI-only mode, show message
  Object.assign(S, {name: 'Flowmap', source: 'snapshot', sel: null});
  S.P = analyze(S.fmap); layoutMap();
  renderAll(true);
  toast('Run /flowmap <project> from Claude Code to load a project.');
}
})();
